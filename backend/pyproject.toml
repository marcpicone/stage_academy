[project]
name = "stage-academy-api"
version = "0.1.0"
requires-python = ">=3.14,<3.16"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.120,<1",
    "Pillow>=12,<14",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.2.1,<1",
    "PyJWT>=2.10.1,<3",
    "sqlalchemy>=2.0.44,<2.1",
    "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
