services:
  - type: web
    name: stage-academy-quiz-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: uv sync --locked --no-dev --extra postgres
    startCommand: uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --no-access-log --limit-concurrency 12
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.15.2
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HOSTED_DEPLOYMENT
        value: "true"
